schema_version: 1
dataset: NF-UNSW-NB15-v3

explainers:
  ig:
    steps: 32
    baseline: zero
    target: predicted_class
  gnn_explainer:
    epochs: 100
    seed: 42
    edge_mask_type: object
    node_mask_type: attributes

explanation_sizes:
  features: [5, 10]
  edges: 5

fidelity:
  randomization_trials: 5
  seed: 42

cache:
  # under XDRIFT_RESULTS/explanations (gitignored); keyed by
  # (checkpoint_sha, anchor_id, explainer, seed, k, config_sha)
  subdir: explanations
  index_csv: index.csv
