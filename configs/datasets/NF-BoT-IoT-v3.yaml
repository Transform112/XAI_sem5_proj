# =============================================================================
# NF-BoT-IoT-v3 - secondary dataset candidate (audited for the dataset review).
# D-013 conflict: paper reports 16,933,808 flows; UQ website / project task say
# 16,993,808; scout-computed class-table sum gives 16,933,844. The identity
# stage recounts from the CSV and reports the delta against each source.
# =============================================================================
name: NF-BoT-IoT-v3
schema: nf_v3
role: secondary-candidate
source:
  provider: University of Queensland NIDS NetFlow-v3 family (Sarhan et al.)
  mirror: kaggle://seyhed/nf-bot-iot-v3
  url: https://www.kaggle.com/api/v1/datasets/download/seyhed/nf-bot-iot-v3
  licence: research use; cite the UQ NetFlow-v3 dataset paper
  authoritative_source: >-
    Luay et al., IEEE Access 2026 (DOI 10.1109/ACCESS.2026.3688204;
    arXiv:2503.04404v3) per decision D-013
published:
  flows: 16933808
  # Paper Table 3 (arXiv:2503.04404v3, D-012 closed): 5 classes, sums exactly to
  # the paper total. The UQ website values (16,993,808 flows / Theft 1,651) are
  # errata and are reported as alternate references, never enforced.
  classes:
    Benign: 51989
    Reconnaissance: 1695132
    DDoS: 7150882
    DoS: 8034190
    Theft: 1615
  attack_total: 16881819
  binary_label: {0: 51989, 1: 16881819}
  alternate_flow_counts:
    uq_website: 16993808
  notes: >-
    Paper total 16,933,808 (D-013 authoritative) with the full paper class table;
    website 16,993,808 and Theft 1,651 are errata (D-012 closed). Measured CSV
    matches the paper exactly (identity artifact 2026-11-01).
class_order: [Benign, Reconnaissance, DDoS, DoS, Theft]
